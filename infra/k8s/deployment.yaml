apiVersion: apps/v1
kind: Deployment
metadata:
  name: lcfms-api
  namespace: lcfms
  labels:
    app: lcfms-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: lcfms-api
  template:
    metadata:
      labels:
        app: lcfms-api
    spec:
      containers:
        - name: api
          image: lcfms/api:latest
          ports:
            - containerPort: 4000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "4000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: lcfms-secrets
                  key: database-url
            - name: REDIS_HOST
              value: "lcfms-redis"
            - name: REDIS_PORT
              value: "6379"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: lcfms-secrets
                  key: jwt-secret
            - name: FRONTEND_URL
              value: "https://app.lcfms.io"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: lcfms-api
  namespace: lcfms
spec:
  selector:
    app: lcfms-api
  ports:
    - port: 80
      targetPort: 4000
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lcfms-web
  namespace: lcfms
  labels:
    app: lcfms-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lcfms-web
  template:
    metadata:
      labels:
        app: lcfms-web
    spec:
      containers:
        - name: web
          image: lcfms/web:latest
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "https://api.lcfms.io"
            - name: NEXT_PUBLIC_MAPBOX_TOKEN
              valueFrom:
                secretKeyRef:
                  name: lcfms-secrets
                  key: mapbox-token
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: lcfms-web
  namespace: lcfms
spec:
  selector:
    app: lcfms-web
  ports:
    - port: 80
      targetPort: 3000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lcfms-ingress
  namespace: lcfms
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - app.lcfms.io
        - api.lcfms.io
      secretName: lcfms-tls
  rules:
    - host: app.lcfms.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lcfms-web
                port:
                  number: 80
    - host: api.lcfms.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lcfms-api
                port:
                  number: 80
